<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선행지수-주가</title>
  <style>
    body { margin: 0; padding: 24px; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f7f9fc; color: #1f2937; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 700; }
    .sub { margin: 0 0 14px; color: #475569; font-size: 14px; }
    .panel { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; }
    .status { margin: 0 0 10px; font-size: 14px; color: #475569; }
    .chart { width: 100%; max-width: 1200px; display: block; border-radius: 8px; border: 1px solid #e2e8f0; background: #ffffff; }
  </style>
</head>
<body>
  <h1>선행지수-주가</h1>
  <p id="dateText" class="sub"></p>
  <section class="panel">
    <p id="status" class="status">이미지를 불러오는 중입니다...</p>
    <img id="chartImage" class="chart" alt="선행지수_주가" hidden />
  </section>
  <script>
    const dateText = document.getElementById("dateText");
    const status = document.getElementById("status");
    const chartImage = document.getElementById("chartImage");
    const date = new URLSearchParams(window.location.search).get("date") || "";

    const toStaticPath = (relativePath) => {
      const segments = relativePath.split("/").map((segment) => encodeURIComponent(segment));
      return `/${segments.join("/")}`;
    };

    if (!/^\d{6}$/.test(date)) {
      status.textContent = "유효한 yymmdd 날짜가 전달되지 않았습니다.";
    } else {
      dateText.textContent = `선택한 폴더: ${date}`;
      const imageRelativePath = `${date}/선행지수_주가.png`;
      chartImage.onload = () => { status.textContent = "이미지 로드 완료"; chartImage.hidden = false; };
      chartImage.onerror = () => { status.textContent = `이미지를 찾을 수 없습니다: ${imageRelativePath}`; chartImage.hidden = true; };
      chartImage.src = toStaticPath(imageRelativePath);
    }
  </script>
</body>
</html>
