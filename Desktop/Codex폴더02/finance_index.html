<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일별 주요 금융지표</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #f7f9fc;
      color: #1f2937;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      font-weight: 700;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .button-row button {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    .button-row button:hover {
      background: #eef2ff;
    }
  </style>
</head>
<body>
  <h1>일별 주요 금융지표</h1>
  <div class="button-row">
    <button type="button">장단기금리차-선행지수</button>
    <button type="button">선행지수-주가</button>
    <button type="button">주가-일별수출액</button>
    <button type="button">장단기금리차-주가</button>
  </div>
</body>
</html>
