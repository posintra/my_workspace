<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일별 주요 금융지표</title>
  <style>
    body { margin: 0; padding: 24px; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f7f9fc; color: #1f2937; }
    h1 { margin: 0 0 16px; font-size: 28px; font-weight: 700; }
    .panel { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 14px; }
    .status { margin: 0 0 10px; font-size: 14px; color: #475569; }
    .date-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .date-btn { border: 1px solid #cbd5e1; border-radius: 999px; background: #f8fafc; padding: 7px 14px; font-size: 13px; cursor: pointer; }
    .date-btn:hover { background: #e2e8f0; }
    .date-btn.active { background: #bfdbfe; border-color: #60a5fa; }
    .metric-buttons { display: flex; flex-direction: column; gap: 10px; max-width: 320px; }
    .metric-btn { text-align: left; border: 1px solid #cbd5e1; border-radius: 8px; background: #ffffff; padding: 10px 12px; font-size: 14px; cursor: pointer; }
    .metric-btn:hover { background: #eef2ff; }
  </style>
</head>
<body>
  <h1>일별 주요 금융지표</h1>

  <section class="panel">
    <p id="folderStatus" class="status">Codex폴더의 yymmdd 폴더를 불러오는 중입니다...</p>
    <div id="dateList" class="date-list"></div>
  </section>

  <section class="panel">
    <p id="selectedDateStatus" class="status">yymmdd 버튼을 선택하면 아래에 4개 버튼이 생성됩니다.</p>
    <div id="metricButtons" class="metric-buttons"></div>
  </section>

  <script>
    const folderStatus = document.getElementById("folderStatus");
    const dateList = document.getElementById("dateList");
    const selectedDateStatus = document.getElementById("selectedDateStatus");
    const metricButtons = document.getElementById("metricButtons");

    const metricNames = [
      "장단기금리차-선행지수",
      "선행지수-주가",
      "주가-일별수출액",
      "장단기금리차-주가",
    ];

    const metricPages = {
      "장단기금리차-선행지수": "spread_leading.html",
      "선행지수-주가": "leading_stock.html",
      "주가-일별수출액": "stock_export.html",
      "장단기금리차-주가": "spread_stock.html",
    };

    const handleMetricClick = (metricName, date) => {
      const page = metricPages[metricName];
      if (!page) return;
      const target = `${page}?date=${encodeURIComponent(date)}`;
      window.open(target, "_blank");
    };

    const renderMetricButtons = (date) => {
      metricButtons.innerHTML = "";
      selectedDateStatus.textContent = `${date} 폴더 선택됨. 아래 4개 지표 버튼을 확인하세요.`;

      for (const name of metricNames) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "metric-btn";
        button.textContent = name;
        button.addEventListener("click", () => handleMetricClick(name, date));
        metricButtons.appendChild(button);
      }
    };

    const loadDateFolders = async () => {
      try {
        const response = await fetch("/api/date-folders");
        if (!response.ok) throw new Error("조회 실패");

        const result = await response.json();
        const dates = result.dates || [];

        dateList.innerHTML = "";
        metricButtons.innerHTML = "";

        if (dates.length === 0) {
          folderStatus.textContent = "yymmdd 형식의 폴더를 찾지 못했습니다.";
          return;
        }

        folderStatus.textContent = `${dates.length}개의 yymmdd 폴더를 찾았습니다. 버튼을 클릭하세요.`;

        for (const date of dates) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "date-btn";
          button.textContent = date;

          button.addEventListener("click", () => {
            document.querySelectorAll(".date-btn").forEach((el) => el.classList.remove("active"));
            button.classList.add("active");
            renderMetricButtons(date);
          });

          dateList.appendChild(button);
        }
      } catch (error) {
        folderStatus.textContent = "폴더 목록을 불러오지 못했습니다. Vercel 배포 또는 로컬 서버 실행 상태를 확인하세요.";
      }
    };

    loadDateFolders();
  </script>
</body>
</html>
