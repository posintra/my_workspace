<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>일별 주요 금융지표</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #f7f9fc;
      color: #1f2937;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      font-weight: 700;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .button-row button {
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }

    .button-row button:hover {
      background: #eef2ff;
    }

    .button-row button.active {
      background: #dbeafe;
      border-color: #93c5fd;
    }

    .chart-wrap {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px;
    }

    .chart-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 600;
    }

    .chart-image {
      width: 100%;
      max-width: 1200px;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>일별 주요 금융지표</h1>
  <div class="button-row">
    <button type="button" class="chart-btn active" data-img="일별금융지표/260519/장단기_선행지수.png" data-title="장단기금리차-선행지수">장단기금리차-선행지수</button>
    <button type="button" class="chart-btn" data-img="일별금융지표/260519/선행지수_주가.png" data-title="선행지수-주가">선행지수-주가</button>
    <button type="button" class="chart-btn" data-img="일별금융지표/260519/주가_일별수출액.png" data-title="주가-일별수출액">주가-일별수출액</button>
    <button type="button" class="chart-btn" data-img="일별금융지표/260519/장단기-주가.png" data-title="장단기금리차-주가">장단기금리차-주가</button>
  </div>

  <div class="chart-wrap">
    <h2 id="chartTitle" class="chart-title">장단기금리차-선행지수</h2>
    <img id="chartImage" class="chart-image" src="일별금융지표/260519/장단기_선행지수.png" alt="장단기금리차-선행지수" />
  </div>

  <script>
    const buttons = document.querySelectorAll(".chart-btn");
    const chartTitle = document.getElementById("chartTitle");
    const chartImage = document.getElementById("chartImage");

    for (const button of buttons) {
      button.addEventListener("click", () => {
        for (const b of buttons) b.classList.remove("active");
        button.classList.add("active");

        const title = button.dataset.title;
        const imgPath = button.dataset.img;
        chartTitle.textContent = title;
        chartImage.src = imgPath;
        chartImage.alt = title;
      });
    }
  </script>
</body>
</html>
